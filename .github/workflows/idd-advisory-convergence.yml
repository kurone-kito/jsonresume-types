name: IDD advisory-convergence gate
# Trigger-migration transition state (ported from idd-skill v0.11.0):
# pull_request is evaluated against the pull request's own merge ref, so a
# same-repository PR could edit this file's copy to force its own required
# check green. pull_request_target closes that gap -- it is evaluated
# against the base branch's own workflow YAML instead -- but cannot fire
# against the PR that first adds or edits this trigger, only against PRs
# opened afterward, so both stay active together rather than a
# single-PR replacement that would leave the implementing PR unable to
# satisfy its own required check. Drop pull_request once this has run
# cleanly on production PRs for a period -- until then, every push runs
# the idd-advisory-convergence job twice (once per trigger), a deliberate,
# temporary increase in Actions consumption. pull_request_review and
# pull_request_review_comment moved to the companion
# idd-advisory-convergence-comment.yml workflow instead of staying here.
concurrency:
  cancel-in-progress: true
  # Grouped by PR number, not github.ref: pull_request_target resolves
  # github.ref to the base branch (the same value for every PR targeting
  # it), so grouping by ref would collapse unrelated PRs into one slot.
  # pull_request and pull_request_target are isolated from each other (both
  # fire on the same opened/synchronize PR event, so whichever instance
  # started later could otherwise cancel the other mid-run, including the
  # pull_request_target instance's own self-waiver job). workflow_dispatch
  # is isolated too, so a manual re-check cannot cancel an in-flight
  # PR-linked run. A new push still correctly cancels a stale run of the
  # same event type for the same PR.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.pr_number) || format('{0}-{1}', github.event_name, github.event.pull_request.number || inputs.pr_number) }}
on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check (e.g. after posting a maintainer waiver)
        required: true
        type: number
permissions:
  contents: read
  issues: read
  pull-requests: read
defaults:
  run:
    # Pins every run: step's shell regardless of runner OS -- GitHub
    # Actions otherwise picks bash on Linux/macOS but PowerShell Core on
    # Windows, which would silently misinterpret this file's POSIX shell
    # syntax instead of failing loudly. A no-op on the ubuntu runner this
    # repository uses today.
    shell: bash
jobs:
  # The job id `idd-advisory-convergence` is the literal check-run context
  # consumed by the rerun helper, advisory-wait policy, the required-status-
  # check entry on main's branch-protection Ruleset, and the external-check
  # waiver selector (including the self-waiver job's own
  # `--check idd-advisory-convergence` below). Do not rename it or add a
  # job-level `name:` key (i.e. jobs.idd-advisory-convergence.name --
  # distinct from the workflow-level `name:` above) without updating every
  # one of those consumers to match.
  idd-advisory-convergence:
    # Falls back to today's ubuntu-latest unless the CI_RUNNER_LABEL
    # repository variable is set (Settings > Secrets and variables >
    # Actions > Variables) -- no behavior change until it's configured.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    # Sequenced after the self-waiver job below so an allowlisted PR's own
    # bootstrap marker is guaranteed to exist (posted or definitively not
    # posted) before this job ever fetches PR comments -- without this
    # ordering the two jobs would start in parallel, and this (typically
    # much faster) job could read comments and fail before the self-waiver
    # job finishes its own diff check and posting call. `if: ${{ !cancelled() }}`
    # overrides `needs:`'s own default (a skipped dependency job skips its
    # dependents too) -- this job must still run on every trigger, including
    # workflow_dispatch or a pull_request run where the self-waiver job's
    # own `if:` skips it outright.
    needs: idd-advisory-convergence-self-waiver
    if: ${{ !cancelled() }}
    # Job-level override of the workflow-level `permissions:` block above,
    # adding `actions: read`: the self-referential-bootstrap-auto trust
    # verification (inside `idd:external-check-waiver`, consumed by this
    # job's own advisory-convergence check) calls
    # `GET /repos/{owner}/{repo}/actions/runs/{id}`, which needs this scope
    # explicitly (an unspecified `GITHUB_TOKEN` permission defaults to
    # `none`, not inherited from the repository's own default). A job-level
    # block replaces the workflow-level one entirely rather than adding to
    # it, so every previously-granted scope is repeated here too.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - name: Stages the trusted default branch
        uses: actions/checkout@v7
        with:
          # Trusted default-branch checkout, not the PR head, for any
          # trigger type including workflow_dispatch: the enforcement
          # helper and its config (.github/idd/config.json) must be the
          # trusted copy, not the PR's own -- otherwise a PR could edit the
          # verdict logic itself to force a passing result. The verdict
          # still correctly evaluates the intended PR: `--pr <number>`
          # below drives every live GitHub API call the helper makes,
          # independent of what is checked out locally.
          ref: main
          persist-credentials: false
      - name: Setup the pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@v7
        with:
          cache: ${{ !env.ACT && 'pnpm' || '' }}
          node-version-file: .node-version
      - env:
          HUSKY: 0
        name: Install the dependencies
        run: pnpm install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        name: Run the advisory-convergence check
        run: pnpm run idd:advisory-convergence --pr "$PR_NUMBER" --assert

  # Optional companion job (idd-skill#2657): a PR that fixes this gate's own
  # checking logic (or a handful of directly-related files) can never
  # benefit from its own fix while unmerged, because the verdict job above
  # always runs the version checked out from `main`. This job auto-posts a
  # narrowly-scoped, run-bound `idd-external-check-waiver` marker for
  # exactly that case. See docs/idd-helper-scripts.md's "Automated
  # self-referential-bootstrap-auto waiver" section for the full trust
  # model and the acceptance conditions `idd:advisory-convergence` verifies
  # before ever honoring the marker -- this job's only role is to detect
  # the trigger and post it; trust is established entirely at consume
  # time, not here.
  #
  # `if: pull_request_target` only, never `pull_request`: a
  # same-repository PR editing this YAML could otherwise also run this job
  # under a `pull_request`-triggered instance it fully controls. The
  # consumer's own run-provenance trust conditions would reject a marker
  # from that instance anyway, but gating the job itself here avoids
  # granting `issues`/`pull-requests` write under an untrusted-YAML
  # trigger in the first place.
  #
  # kurone-kito/idd-skill#2951 (post-v0.11.0 upstream fix, commit
  # adad8ae43c5a1b6fc3a100ce384c8a84a8d5139d, PR #2954): `pull-requests`
  # must be `write`, not `read`. With only `read`, the marker POST to
  # `issues/<PR_NUMBER>/comments` in "Post the self-referential-bootstrap-
  # auto waiver" below failed with HTTP 403 "Resource not accessible by
  # integration" on 11/11 real invocations across 3 PRs upstream. A live
  # A/B test (upstream runs 34697203153 and 34697250102, PR #2949)
  # reproduced the 403 under `read` and confirmed success under `write`,
  # with `issues: write` held constant in both runs -- so this grant is
  # proven necessary; do not narrow it back to `read` without re-running an
  # equivalent live test. `issues: write` is unchanged (it posts the
  # marker's own comment body and reads the linked issue's comment stream
  # to resolve its active claim).
  idd-advisory-convergence-self-waiver:
    if: github.event_name == 'pull_request_target'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Stages the trusted default branch
        uses: actions/checkout@v7
        with:
          # Trusted default-branch checkout, not the PR head -- see the
          # verdict job's own comment above for the full rationale. This
          # job's posting logic (external-check-waiver) must be the
          # trusted copy too, or a PR could edit it to post a
          # differently-shaped marker or waive an unrelated check.
          ref: main
          persist-credentials: false
      - name: Detect self-referential trigger-file allowlist touch
        id: allowlist
        # This repository's confirmed helperRuntime.profile is
        # package-manager (fixed, not resolved per-run), so the allowlist
        # below is hardcoded to exactly what idd:external-check-waiver's
        # own resolveSelfReferentialTriggerFiles independently derives for
        # that profile: the profile-invariant base set (the two
        # advisory-convergence workflow files and .github/idd/config.json)
        # plus the dependency manifest and every supported lockfile name.
        # `gh pr diff --name-only` only reports a renamed file's NEW name;
        # the PR files REST endpoint below reports both `filename` and (when
        # present) `previous_filename`, so a rename away from an
        # allowlisted path is still detected.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ALLOWLIST=(
            ".github/idd/config.json"
            ".github/workflows/idd-advisory-convergence.yml"
            ".github/workflows/idd-advisory-convergence-comment.yml"
            "package.json"
            "package-lock.json"
            "pnpm-lock.yaml"
            "yarn.lock"
          )
          CHANGED=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" \
            --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          TOUCHED=false
          for FILE in "${ALLOWLIST[@]}"; do
            if grep -qxF "$FILE" <<<"$CHANGED"; then
              TOUCHED=true
              break
            fi
          done
          echo "touched=$TOUCHED" >> "$GITHUB_OUTPUT"
      - name: Setup the pnpm
        if: steps.allowlist.outputs.touched == 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Prepare the Node.js environment
        if: steps.allowlist.outputs.touched == 'true'
        uses: actions/setup-node@v7
        with:
          cache: ${{ !env.ACT && 'pnpm' || '' }}
          node-version-file: .node-version
      - env:
          HUSKY: 0
        name: Install the dependencies
        if: steps.allowlist.outputs.touched == 'true'
        run: pnpm install --frozen-lockfile
      - name: Post the self-referential-bootstrap-auto waiver
        # Skip a fork PR entirely: the consumer's run-bound trust check
        # would reject it anyway (a fork's own workflow run never matches
        # this repository), so this avoids a doomed post and the API calls
        # it would cost.
        if: steps.allowlist.outputs.touched == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        id: post-waiver
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Every profile branch below pipes its own invocation through the
        # same `tee`, so the common post-processing after it (reading
        # `applied`/`commentId`/`bodyDigest` back out of the CLI's own JSON
        # report) is written once. `node -e` parses it defensively: a parse
        # failure (should not happen, `tee` writes exactly what stdout
        # produced) degrades to "nothing to record", never a crashed job.
        # `bodyDigest` is the SHA-256 hex digest of the posted comment's
        # body, taken only from the create-comment API response for this
        # exact POST.
        run: |
          pnpm run idd:external-check-waiver --pr "$PR_NUMBER" --check idd-advisory-convergence --reason self-referential-bootstrap-auto --run-id "$GITHUB_RUN_ID" --auto-bootstrap --apply --yes | tee /tmp/idd-waiver-report.json
          APPLIED=$(node -e '
            try {
              const report = JSON.parse(require("fs").readFileSync("/tmp/idd-waiver-report.json", "utf8"));
              process.stdout.write(String(report.applied ?? false));
            } catch {
              process.stdout.write("false");
            }
          ')
          COMMENT_ID=$(node -e '
            try {
              const report = JSON.parse(require("fs").readFileSync("/tmp/idd-waiver-report.json", "utf8"));
              process.stdout.write(String(report.commentId ?? ""));
            } catch {
              process.stdout.write("");
            }
          ')
          BODY_DIGEST=$(node -e '
            try {
              const report = JSON.parse(require("fs").readFileSync("/tmp/idd-waiver-report.json", "utf8"));
              process.stdout.write(String(report.bodyDigest ?? ""));
            } catch {
              process.stdout.write("");
            }
          ')
          echo "applied=$APPLIED" >> "$GITHUB_OUTPUT"
          echo "comment-id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "body-digest=$BODY_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Record the posted marker's provenance
        # A run-scoped Actions artifact naming the exact comment id and body
        # digest this run's own trusted job just posted -- the binding
        # primitive the consumer reads to prove a candidate marker IS the
        # one this run's own execution posted, not merely that no other
        # candidate is currently visible. Only when a new comment was
        # actually posted this run (`applied == 'true'`) -- the reuse path
        # (an existing valid waiver found, nothing newly posted) has no
        # comment of this run's own to record. Needs no `permissions:`
        # entry: actions/upload-artifact uses the Actions runtime's own
        # dedicated upload token, entirely separate from `GITHUB_TOKEN`.
        if: steps.post-waiver.outputs.applied == 'true' && steps.post-waiver.outputs.comment-id != '' && steps.post-waiver.outputs.body-digest != ''
        env:
          COMMENT_ID: ${{ steps.post-waiver.outputs.comment-id }}
          BODY_DIGEST: ${{ steps.post-waiver.outputs.body-digest }}
        run: |
          mkdir -p /tmp/idd-self-waiver-marker
          printf 'commentId=%s\nbodyDigest=%s\n' "$COMMENT_ID" "$BODY_DIGEST" \
            > "/tmp/idd-self-waiver-marker/idd-self-waiver-marker-${COMMENT_ID}-${BODY_DIGEST}"
      - name: Upload the posted marker's provenance artifact
        # v4+ has no GHES Artifacts backend (GHES needs v3.2.2).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.post-waiver.outputs.applied == 'true' && steps.post-waiver.outputs.comment-id != '' && steps.post-waiver.outputs.body-digest != ''
        with:
          name: idd-self-waiver-marker-${{ steps.post-waiver.outputs.comment-id }}-${{ steps.post-waiver.outputs.body-digest }}
          path: /tmp/idd-self-waiver-marker/
          # Loud failure, not a silent empty artifact, if the previous step
          # somehow produced no file.
          if-no-files-found: error
          # Deliberately not retention-days: 1 -- a later re-evaluation can
          # run well after this run finishes, and the marker's own validity
          # window outlives a short artifact retention -- keep the
          # repository default so the artifact stays listable for the
          # marker's full validity window.
