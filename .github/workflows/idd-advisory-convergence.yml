name: IDD advisory-convergence gate
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number }}
on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check (e.g. after posting a maintainer waiver)
        required: true
        type: number
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  # The job id `idd-advisory-convergence` is the literal check-run context
  # consumed by the rerun helper, advisory-wait policy, the required-status-
  # check entry on main's branch-protection Ruleset, and the external-check
  # waiver selector. Do not rename it or add a `name:` display-name key
  # without updating every one of those consumers to match.
  idd-advisory-convergence:
    # Falls back to today's ubuntu-latest unless the CI_RUNNER_LABEL
    # repository variable is set (Settings > Secrets and variables >
    # Actions > Variables) -- no behavior change until it's configured.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Stages the trusted default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Setup the pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@v7
        with:
          cache: ${{ !env.ACT && 'pnpm' || '' }}
          node-version-file: .node-version
      - env:
          HUSKY: 0
        name: Install the dependencies
        run: pnpm install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        name: Run the advisory-convergence check
        run: pnpm run idd:advisory-convergence --pr "$PR_NUMBER" --assert
